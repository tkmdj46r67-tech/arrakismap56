<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrakis – Interactive Globe (Interpretation)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #globe-container {
            width: 100vw;
            height: 100vh;
        }
        #disclaimer {
            position: absolute;
            bottom: 12px;
            left: 12px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 12px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 10;
        }
        #info-panel {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.75);
            color: #e0e0e0;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 220px;
            pointer-events: none;
            z-index: 10;
            border: 1px solid #3a3a3a;
        }
        #info-panel h1 {
            margin: 0 0 6px 0;
            font-size: 18px;
            color: #d4a373;
        }
        #info-panel p {
            margin: 4px 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="globe-container"></div>
    <div id="disclaimer">
        <strong>Interpretation</strong> – Not an official Dune map. For reading aid only.
    </div>
    <div id="info-panel">
        <h1>Arrakis</h1>
        <p>Key locations on the desert planet</p>
        <p style="font-size: 12px; color: #aaa;">Drag to rotate · Scroll to zoom</p>
    </div>

    <!-- Load Globe.gl from CDN -->
    <script src="//cdn.jsdelivr.net/npm/globe.gl@2.34.0/dist/globe.gl.min.js"></script>

    <script>
        // --------------------------------------------------------------
        // 1. DATA – Approximate coordinates for Arrakis locations.
        //    Based on the fan map from the forum post, which centers
        //    on the north pole. Latitudes range from ~50° to 90° N.
        //    Longitudes are relative to Observatory Mount (0°).
        // --------------------------------------------------------------
        const arrakisLocations = [
            { name: 'Arrakeen', lat: 60, lng: 0, color: '#f4a261', size: 0.7 },
            { name: 'Carthag', lat: 62, lng: 12, color: '#e76f51', size: 0.6 },
            { name: 'Sietch Tabr', lat: 58, lng: -20, color: '#2a9d8f', size: 0.6 },
            { name: 'Habbanya Sietch', lat: 55, lng: -40, color: '#2a9d8f', size: 0.5 },
            { name: 'Tuek\'s Sietch', lat: 50, lng: 30, color: '#2a9d8f', size: 0.5 },
            { name: 'Shield Wall', lat: 65, lng: 0, color: '#e9c46a', size: 0.8 },
            { name: 'Imperial Basin', lat: 70, lng: -10, color: '#e9c46a', size: 0.6 },
            { name: 'Funeral Plain', lat: 75, lng: 20, color: '#a8dadc', size: 0.5 },
            { name: 'Great Flat', lat: 80, lng: 0, color: '#a8dadc', size: 0.7 },
            { name: 'Cielago Depression', lat: 85, lng: -30, color: '#a8dadc', size: 0.5 },
            { name: 'Observatory Mount', lat: 60, lng: 0, color: '#ffb703', size: 0.4 },
            { name: 'Polar Sink', lat: 90, lng: 0, color: '#ffb703', size: 0.5 }
        ];

        // --------------------------------------------------------------
        // 2. GENERATE A PROCEDURAL DESERT PLANET TEXTURE
        //    Creates a canvas with a sandy, rocky appearance.
        // --------------------------------------------------------------
        function createDesertTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // Base sand color
            ctx.fillStyle = '#c2a278';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add noise for terrain variation
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * 40;
                data[i] = Math.min(255, Math.max(0, data[i] + noise));     // R
                data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise)); // G
                data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise)); // B
            }
            ctx.putImageData(imageData, 0, 0);

            // Draw some darker rocky patches
            ctx.fillStyle = 'rgba(80, 60, 40, 0.3)';
            for (let i = 0; i < 200; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const r = Math.random() * 100 + 20;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw lighter dust streaks
            ctx.fillStyle = 'rgba(220, 200, 170, 0.2)';
            for (let i = 0; i < 100; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const w = Math.random() * 200 + 50;
                const h = Math.random() * 30 + 10;
                ctx.fillRect(x, y, w, h);
            }

            return canvas.toDataURL('image/jpeg', 0.9);
        }

        const desertTextureUrl = createDesertTexture();

        // --------------------------------------------------------------
        // 3. INITIALISE GLOBE
        // --------------------------------------------------------------
        const container = document.getElementById('globe-container');
        const world = Globe()
            .globeImageUrl(desertTextureUrl)
            .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
            .showAtmosphere(true)
            .atmosphereColor('#d4a373')
            .atmosphereAltitude(0.1)
            (container);

        // Set initial camera position – look at the north pole
        world.pointOfView({ lat: 70, lng: 0, altitude: 2.0 });

        // --------------------------------------------------------------
        // 4. ADD LOCATION MARKERS
        // --------------------------------------------------------------
        world
            .pointsData(arrakisLocations)
            .pointLat('lat')
            .pointLng('lng')
            .pointColor('color')
            .pointAltitude(0.01)
            .pointRadius('size')
            .pointLabel('name')
            .pointResolution(16)
            .pointsMerge(false)
            .pointsTransitionDuration(0);

        // Add labels for major locations
        world
            .labelsData(arrakisLocations)
            .labelLat('lat')
            .labelLng('lng')
            .labelText('name')
            .labelSize(0.7)
            .labelColor('color')
            .labelDotRadius(0.15)
            .labelAltitude(0.015)
            .labelResolution(2);

        // --------------------------------------------------------------
        // 5. CONTROLS
        // --------------------------------------------------------------
        world.controls().autoRotate = false;
        world.controls().enableDamping = true;
        world.controls().dampingFactor = 0.1;

        // --------------------------------------------------------------
        // 6. RESIZE HANDLER
        // --------------------------------------------------------------
        window.addEventListener('resize', () => {
            world.width(window.innerWidth);
            world.height(window.innerHeight);
        });
    </script>
</body>
</html>
